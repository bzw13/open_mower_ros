name: Push Image (manual)

# Manually build a single-arch (arm64) image and push it to ghcr.io.
# arm64 is what the mower (Raspberry Pi, linux/arm64/v8) runs; built natively
# on an arm64 runner. Uses the built-in GITHUB_TOKEN, so no GHCR_TOKEN secret
# is required on a fork.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - legacy
      tag:
        description: 'Image tag (leave blank to use the branch name)'
        required: false
        default: ''
        type: string
      clean_build:
        description: 'Clean build without cache'
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare
        env:
          REPOSITORY: '${{ github.repository }}'
          TAG_INPUT: '${{ inputs.tag }}'
        run: |
          echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}
          # Tag defaults to the branch the workflow was dispatched from.
          TAG="${TAG_INPUT:-${{ github.ref_name }}}"
          if [ "${{ inputs.variant }}" = "legacy" ]; then
            echo "DOCKERFILE=./docker/Dockerfile.Legacy" >> ${GITHUB_ENV}
            echo "IMAGE_TAG=${TAG}-legacy" >> ${GITHUB_ENV}
          else
            echo "DOCKERFILE=./docker/Dockerfile" >> ${GITHUB_ENV}
            echo "IMAGE_TAG=${TAG}" >> ${GITHUB_ENV}
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: arm64
          no-cache: ${{ inputs.clean_build }}
          tags: ghcr.io/${{ env.REPOSITORY_LC }}:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=gha,scope=manual-arm64-${{ inputs.variant }}
          cache-to: type=gha,scope=manual-arm64-${{ inputs.variant }},mode=max
